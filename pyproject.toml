[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
description = "DocuMind AI - Document Intelligence Platform (M0/M1: OCR baseline)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddlepaddle>=3.0,<4",
    "paddleocr>=3.0,<4",
    "pillow>=10.1",
    "opencv-contrib-python>=4.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
documind-ocr = "documind.cli:main"
documind-extract = "documind.extract_cli:main"
documind-table = "documind.table_cli:main"
documind-eval = "documind.evaluation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
