[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "documind-ai"
version = "0.1.0"
description = "DocuMind AI - Document Intelligence Platform (OCR, invoice extraction, ruled tables, evaluation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "paddlepaddle>=3.0,<4",
    "paddleocr>=3.0,<4",
    "pillow>=10.1",
    "opencv-contrib-python>=4.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pypdfium2>=4",
]

[project.scripts]
documind-ocr = "documind.cli:main"
documind-extract = "documind.extract_cli:main"
documind-table = "documind.table_cli:main"
documind-eval = "documind.evaluation.cli:main"
documind-dataset = "documind.dataset_cli:main"
documind-web = "documind.web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF", "ISC", "FURB"]
ignore = ["SIM108", "SIM102"]  # ternary/collapse rewrites hurt readability here
allowed-confusables = ["–", "×", "—", "’"]  # intentional: dash stripping, qty x price
