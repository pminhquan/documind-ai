# Application-logic CI: runs the unit test suite with mocked inference.
# It does NOT install PaddlePaddle, does NOT download OCR model weights,
# and does NOT require a GPU. A green CI therefore validates the
# deterministic extraction/validation/CLI code paths - it does not
# measure OCR model accuracy.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pillow openpyxl opencv-python-headless ruff

      - name: Lint (ruff)
        run: ruff check src tests scripts

      - name: Run tests
        run: pytest
